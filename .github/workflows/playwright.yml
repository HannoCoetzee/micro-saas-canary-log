name: Playwright E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch to fleet-ci
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.FLEET_CI_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: 'HannoCoetzee',
              repo: 'fleet-ci',
              event_type: 'run-playwright',
              client_payload: {
                repo: 'micro-saas-canary-log',
                ref: context.ref,
                pr_number: context.payload.pull_request?.number || ''
              }
            });
