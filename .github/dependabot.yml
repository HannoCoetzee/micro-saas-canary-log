version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Australia/Sydney"
    open-pull-requests-limit: 10
    groups:
      npm-minor:
        update-types:
          - "minor"
          - "patch"
      npm-major:
        update-types:
          - "major"
